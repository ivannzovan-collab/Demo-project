<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PWA Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        canvas {
            display: none;
        }
        .preview {
            margin: 20px 0;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .preview img {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 DramaSnap Icon Generator</h1>
        <p>Click the buttons below to generate and download PWA icons</p>

        <div class="preview" id="preview"></div>

        <div>
            <button onclick="generateIcon(192)">Generate 192x192 Icon</button>
            <button onclick="generateIcon(512)">Generate 512x512 Icon</button>
        </div>

        <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
            Save the downloaded icons as pwa-192.png and pwa-512.png<br>
            in the web/public/ folder
        </p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        function generateIcon(size) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = size;
            canvas.height = size;

            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#8B5CF6');
            gradient.addColorStop(0.5, '#EC4899');
            gradient.addColorStop(1, '#8B5CF6');

            // Draw rounded rectangle background
            const radius = size * 0.2;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fill();

            // Draw emoji
            const emojiSize = size * 0.5;
            ctx.font = `${emojiSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎬', size / 2, size / 2);

            // Convert to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pwa-${size}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // Show preview
                const preview = document.getElementById('preview');
                const img = document.createElement('img');
                img.src = url;
                img.width = Math.min(size, 192);
                img.alt = `${size}x${size} icon`;
                preview.appendChild(img);
            });
        }
    </script>
</body>
</html>
